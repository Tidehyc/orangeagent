[workspace]
resolver = "3"
members = [
    "crates/orangeagent-ai",
    "crates/orangeagent-core",
    "crates/orangeagent-harness",
    "crates/orangeagent-spine",
    "crates/orangeagent-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tide/orangeagent"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
nix = { version = "0.29", default-features = false, features = ["signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
unnecessary_literal_bound = "allow"
